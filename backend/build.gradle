plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.8'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.works.keyka'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.flywaydb:flyway-database-postgresql'
	implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:4.0.1'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter-test:4.0.1'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
}

// ---- シードCSVの検証(DB・Spring不要) -------------------------------------------
// CSVを編集したら、まずこれを実行する。問題は「ファイル名:行番号」つきで表示される。
tasks.register('validateSeed', JavaExec) {
    group = 'seed'
    description = 'db/seed のCSVを検証する(エラーがあれば失敗)'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.works.keyka.damagecalc.infrastructure.seed.SeedValidationMain'
    args = ['validate', "${projectDir}/src/main/resources/db/seed"]
}

// 投入されるSQLを build/seed.sql に書き出す(中身の確認用)
tasks.register('dumpSeedSql', JavaExec) {
    group = 'seed'
    description = '投入されるSQLを build/seed.sql に書き出す'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.works.keyka.damagecalc.infrastructure.seed.SeedValidationMain'
    args = ['dump-sql', "${projectDir}/src/main/resources/db/seed", "${buildDir}/seed.sql"]
}